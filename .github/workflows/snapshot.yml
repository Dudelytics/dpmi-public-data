name: Daily public derived snapshot
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-public-derived-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture only public derived values
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python snapshot.py; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 300; fi
          done
          exit 1
      - name: Commit dated files
        shell: bash
        run: |
          set -euo pipefail
          git add -- data/
          if git diff --cached --quiet; then exit 0; fi
          day="$(date -u +%F)"
          git config user.name 'Dudelytics archive bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Public derived snapshots ${day} UTC"
          git push
