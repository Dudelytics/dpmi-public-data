name: Mirror public archive to Hugging Face
on:
  workflow_run:
    workflows: ['Daily public derived snapshot']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: huggingface-public-archive-mirror
  cancel-in-progress: false
jobs:
  mirror:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate committed public archive
        run: python mirror_huggingface.py --check-only
      - name: Check overwrite and sanitizing safeguards
        run: python -m unittest test_mirror_huggingface.py
      - name: Install pinned Hub client
        run: python -m pip install 'huggingface_hub==1.32.0'
      - name: Mirror and verify public snapshots
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python mirror_huggingface.py
